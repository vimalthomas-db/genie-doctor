# Genie Doctor — Databricks Asset Bundle (portable).
# Deploy into ANY workspace:
#   databricks bundle deploy -t prod -p <profile>          # creates tables, pipeline, job, lakebase, app
#   databricks bundle run genie_doctor_refresh -t prod     # run full diagnostics once (or use the app's Refresh button)
#
# Everything is serverless — NO SQL warehouse dependency (app reads Lakebase Postgres,
# pipeline + job run serverless). Only workspace-specific input is the owner_prefix.

bundle:
  name: genie-doctor

# Two serving "versions" — pick with the `serving_backend` variable:
#   lakehouse (default) -> the app reads gold Delta through the bound SQL warehouse.
#                          NO Lakebase needed; deploys cleanly in any workspace.
#   lakebase            -> the app reads a Postgres mirror (ms latency). To enable it:
#                            1) uncomment `resources/database.yml` in `include:` below,
#                            2) set  serving_backend: lakebase  on the target,
#                            3) provide pg_host (deploy.sh captures it automatically).
include:
  - resources/app.yml
  - resources/job.yml
  - resources/pipeline.yml
  # Lakebase serving layer (instance + UC catalog + synced tables). OPTIONAL — uncomment
  # ONLY when serving_backend=lakebase, otherwise deploy stays Lakebase-free.
  # - resources/database.yml

variables:
  serving_backend:
    description: >-
      Where the app reads its gold tables: `lakehouse` (SQL warehouse over Delta, no
      Lakebase dependency — default) or `lakebase` (Postgres mirror). `auto` uses
      Lakebase when configured+reachable, else Lakehouse.
    default: lakehouse
  catalog:
    description: UC catalog for bronze + gold tables (must exist or be creatable).
    default: main
  schema:
    description: UC schema for bronze + gold.
    default: genie_doctor
  owner_prefix:
    description: >-
      Fallback ingestion scope for a fresh workspace where the exact space list is
      unknown — harvests spaces whose parent_path starts with this. Used only when
      space_ids is empty.
    default: ""
  space_ids:
    description: >-
      Fixed comma-separated Genie space IDs to harvest (fast path — no whole-workspace
      enumeration). Preferred over owner_prefix when known.
    default: ""
  sync_pipeline_ids:
    description: >-
      Comma-separated pipeline ids of the Lakebase synced tables, refreshed at the end of
      each run so Postgres stays current. Created with the synced tables (database.yml);
      set per workspace.
    default: ""
  lakebase_instance:
    description: Lakebase (Postgres) instance name the bundle creates + syncs to.
    default: genie-doctor-db
  lakebase_catalog:
    description: UC catalog registered over the Lakebase instance (home for the synced tables).
    default: genie_doctor_lb
  lakebase_db:
    description: Logical Postgres database inside the Lakebase instance.
    default: genie_doctor
  warehouse_id:
    description: SQL warehouse the app binds to (metadata fallback; hot path is Postgres).
    default: ""
  pg_host:
    description: Lakebase Postgres host for the app (read from the instance after it exists).
    default: ""

